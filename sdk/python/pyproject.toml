[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pith-digest"
version = "0.1.0"
description = "pith digest SDK: SHA-256, CRC-32, Adler-32, FNV-1a 64 and splitmix64 via the pith-digest Rust cdylib (ctypes, zero-dep)"
license = "MIT"
requires-python = ">=3.9"
keywords = ["sha256", "crc32", "adler32", "fnv", "splitmix64", "hashing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Security :: Cryptography",
]

[project.urls]
Repository = "https://github.com/pith-hash/pith-digest"
Homepage = "https://github.com/pith-hash/pith-digest"

[tool.setuptools]
packages = ["pith_digest"]

[tool.setuptools.package-data]
pith_digest = ["*.dll", "*.dylib", "*.so"]
