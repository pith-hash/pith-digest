[package]
name = "pith-digest"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "pith foundation: digest (zero-dep Rust)"
readme = "README.md"
license = "MIT"
categories = ["algorithms", "cryptography"]

[dependencies]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["std"]
std = []

[[bin]]
name = "gen-reference"
path = "tools/gen-reference/main.rs"

[lints.rust]
missing_docs = "deny"
